services:
  api:
    container_name: evolution_api
    command: npm run start:dev
    ports:
      - "8080:8080"
    volumes:
      # Sync source so code changes are picked up without rebuilds
      - ./src:/evolution/src
      - ./public:/evolution/public
      - ./prisma:/evolution/prisma
      - ./manager:/evolution/manager
      - ./Docker:/evolution/Docker
      - ./tsconfig.json:/evolution/tsconfig.json:ro
      - ./tsup.config.ts:/evolution/tsup.config.ts:ro
      - ./package.json:/evolution/package.json:ro
      - ./package-lock.json:/evolution/package-lock.json:ro
      - ./runWithProvider.js:/evolution/runWithProvider.js:ro
      # Separate instance storage so dev and prod don’t clash
      - evolution_instances:/evolution/instances
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  frontend:
    container_name: evolution_frontend
    ports:
      - "3000:80"
    volumes:
      - ./Docker/nginx-manager.conf:/etc/nginx/conf.d/nginx.conf:ro
